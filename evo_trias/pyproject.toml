[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evotrias"
version = "0.1.0"
description = "Agent Self-Evolution System for Optimization Benchmarks"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "fastmcp>=3.3.0",
    "jinja2>=3.1",
]

[tool.setuptools.packages.find]
include = ["evotrias*"]

[tool.setuptools.package-data]
"evotrias" = ["templates/**"]
"evotrias.dashboard" = ["static/**"]
