[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evotrias"
version = "0.1.0"
description = "Agent Self-Evolution System for Optimization Benchmarks"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "fastmcp>=3.3.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pyyaml>=6.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "pyright>=1.1",
]

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 120

[tool.pyright]
include = ["evotrias"]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.setuptools.packages.find]
include = ["evotrias*"]

[tool.setuptools.package-data]
"evotrias.dashboard" = ["static/**"]
