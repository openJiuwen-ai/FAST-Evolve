[tool.uv.workspace]
members = ["evo_trias"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pyyaml>=6.0",
    "black>=22.0.0",
    "ruff>=0.17.0",
    "pyright>=1.1",
]

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 120
target-version = "py310"
include = ["evo_trias/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["evotrias"]

[tool.pyright]
include = ["evo_trias/evotrias"]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"
