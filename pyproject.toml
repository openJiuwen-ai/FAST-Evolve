[tool.uv.workspace]
members = ["evo_trias"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pyyaml>=6.0",
    "black>=22.0.0",
    "ruff>=0.17.0",
    "pyright>=1.1",
]

[tool.black]
line-length = 120
target-version = ['py311']
include = '^/(evo_trias|tests)/.*\.pyi?$'
force-exclude = '^/(benchmarks|test_problem)/'

[tool.ruff]
line-length = 120
target-version = "py311"
include = ["evo_trias/**/*.py", "tests/**/*.py", "benchmarks/**/*.py", "test_problem/**/*.py"]
force-exclude = true

[tool.ruff.lint]
select = ["F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["evotrias"]

[tool.pyright]
include = ["evo_trias/evotrias"]
extraPaths = ["evo_trias"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"
